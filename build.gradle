import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
}

group = 'net.augustus'
version = 'b4.23.3'

def currentOs = OperatingSystem.current()
def osClassifier = currentOs.isWindows() ? 'windows' : (currentOs.isMacOsX() ? 'osx' : 'linux')
def jfxClassifier = currentOs.isWindows() ? 'win' : (currentOs.isMacOsX() ? 'mac' : 'linux')

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Minecraft'
        url = uri('https://libraries.minecraft.net/')
        content {
            includeGroup 'com.mojang'
            includeGroup 'com.ibm.icu'
            includeGroup 'com.paulscode'
            includeGroup 'org.lwjgl.lwjgl'
        }
    }
    maven {
        name = 'ViaVersion'
        url = uri('https://repo.viaversion.com')
    }
    maven {
        name = 'Lenni0451'
        url = uri('https://maven.lenni0451.net/releases')
    }
    maven {
        name = 'Wagyourtail'
        url = uri('https://maven.wagyourtail.xyz/releases')
    }
}

configurations {
    natives
    jvmdgTool {
        canBeResolved = true
        canBeConsumed = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
        }
    }
    java8Downgrade {
        canBeResolved = true
        canBeConsumed = false
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 21)
        }
    }
}

def downgradedDepsDir = layout.buildDirectory.dir('downgraded-deps')

def downgradeJava8Deps = tasks.register('downgradeJava8Deps') {
    group = 'build'
    description = 'Downgrades Java 11+/17+ Gradle dependencies (ViaVersion, OpenJFX) to Java 8 bytecode.'
    inputs.files(configurations.java8Downgrade)
    outputs.dir(downgradedDepsDir)

    doLast {
        def outDir = downgradedDepsDir.get().asFile
        outDir.mkdirs()
        def jvmdgWorkDir = layout.buildDirectory.dir('tmp/jvmdg').get().asFile
        jvmdgWorkDir.mkdirs()

        def inputFiles = configurations.java8Downgrade.resolve()
        def extraCp = configurations.compileClasspath.resolve().findAll { !it.absolutePath.startsWith(outDir.absolutePath) }
        def allCp = (inputFiles + extraCp).unique()
        def expectedNames = new HashSet<String>()
        def cpString = allCp.collect { it.absolutePath }.join(File.pathSeparator)

        inputFiles.each { File jarFile ->
            if (!jarFile.name.endsWith('.jar')) {
                return
            }
            def outName = jarFile.name.replace('.jar', '-java8.jar')
            expectedNames.add(outName)
            def outFile = new File(outDir, outName)
            if (!outFile.exists() || outFile.lastModified() < jarFile.lastModified()) {
                javaexec {
                    workingDir = jvmdgWorkDir
                    classpath = configurations.jvmdgTool
                    mainClass = 'xyz.wagyourtail.jvmdg.compile.ZipDowngrader'
                    jvmArgs '-Djava.util.concurrent.ForkJoinPool.common.parallelism=1'
                    args '52', jarFile.absolutePath, outFile.absolutePath, cpString
                }
            }
        }

        outDir.listFiles()?.each { File existing ->
            if (!expectedNames.contains(existing.name)) {
                existing.delete()
            }
        }
    }
}

