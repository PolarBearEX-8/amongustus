def mergeServiceFiles = { Collection<File> jars, File outDir ->
    if (outDir.exists()) {
        outDir.deleteDir()
    }
    def merged = new LinkedHashMap<String, LinkedHashSet<String>>()
    jars.each { File jarFile ->
        if (!jarFile.isFile() || !jarFile.name.endsWith('.jar')) {
            return
        }
        new java.util.zip.ZipFile(jarFile).withCloseable { zf ->
            zf.entries().each { entry ->
                if (!entry.isDirectory() && entry.name.startsWith('META-INF/services/')) {
                    def set = merged.computeIfAbsent(entry.name) { new LinkedHashSet<String>() }
                    zf.getInputStream(entry).withReader('UTF-8') { reader ->
                        reader.eachLine { line ->
                            def trimmed = line.trim()
                            if (!trimmed.isEmpty() && !trimmed.startsWith('#')) {
                                set.add(trimmed)
                            }
                        }
                    }
                }
            }
        }
    }
    merged.each { String path, Set<String> lines ->
        File target = new File(outDir, path)
        target.parentFile.mkdirs()
        target.setText(lines.join('\n') + '\n', 'UTF-8')
    }
}

def fatJarServicesDir = layout.buildDirectory.dir('tmp/fatJar-services')

def mergeFatJarServices = tasks.register('mergeFatJarServices') {
    dependsOn downgradeJava8Deps
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(fatJarServicesDir)
    doLast {
        mergeServiceFiles(configurations.runtimeClasspath.resolve(), fatJarServicesDir.get().asFile)
    }
}

def fatJar = tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Builds a standalone runnable fat JAR (java -jar) with all dependencies and natives bundled.'
    dependsOn tasks.named('classes'), downgradeJava8Deps, mergeFatJarServices

    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    zip64 = true

    manifest {
        attributes(
            'Main-Class': 'Start',
            'Multi-Release': 'true'
        )
    }

    from(sourceSets.main.output)
    from(fatJarServicesDir)
    from({
        configurations.runtimeClasspath.resolve().collect { File f ->
            f.isDirectory() ? f : zipTree(f)
        }
    }) {
        exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/MANIFEST.MF'
        exclude 'META-INF/services/**'
        exclude '**/module-info.class'
    }
}

tasks.named('assemble') {
    dependsOn fatJar
}

def compatibilityClientName = 'OpenAugustus'
def compatibilityDir = layout.buildDirectory.dir("compatibility/${compatibilityClientName}")
def compatibilityServicesDir = layout.buildDirectory.dir('tmp/compatibilityJar-services')

def isLauncherProvidedNativeDep = { File f ->
    String n = f.name
    return n.startsWith('lwjgl-') || n.startsWith('lwjgl_util-') || n.startsWith('jinput-') || n.startsWith('jutils-')
}

def mergeCompatibilityJarServices = tasks.register('mergeCompatibilityJarServices') {
    dependsOn downgradeJava8Deps
    inputs.files(configurations.runtimeClasspath)
    outputs.dir(compatibilityServicesDir)
    doLast {
        def bundledJars = configurations.runtimeClasspath.resolve().findAll { !isLauncherProvidedNativeDep(it) }
        mergeServiceFiles(bundledJars, compatibilityServicesDir.get().asFile)
    }
}

