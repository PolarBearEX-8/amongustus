  cameranoclip:
    description: Allows the camera to move through blocks in the game world
    settings: {}
  freelook:
    description: Allows the player to freely move their camera around the viewpoint
    settings:
      thirdperson: Aktiviert automatisch Third-Person Ansicht
      disableitinfistperson: Deaktiviert Freelook in First-Person Ansicht
  brightplayers:
    description: Makes all players bright ingame
    settings: {}
  moreswing:
    description: Renders fake swings, so it looks like you click with high cps
    settings:
      whilekillaura: Triggers swing animation when KillAura is active and has a target
      whileautoclicker: Triggers swing animation when AutoClicker is running
      whileleftclick: Triggers swing animation when left mouse button is pressed
  aspectratio:
    description: You want to stretch your game? This module makes it possible
    settings:
      aspect: Controls the aspect ratio multiplier for screen stretching (1 = normal, lower values = more stretched)
      hand: Applies the aspect ratio modification to the player's hand rendering when enabled
  customfireheight:
    description: Change the fire height when you are burning
    settings:
      removefire: Completely removes the fire overlay from your screen when burning
      fireheight: Sets the vertical height of the fire overlay when burning (-0.7 = very low, 0 = normal height)
  xray:
    description: Allows you to see ores and specific blocks through walls
    settings: {}
  armorstatus:
    description: Displays your current armor durability and items on screen
    settings:
      posx: Sets the horizontal position of the armor status display on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the armor status display on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the armor status display (0.5 = half size, 4 = quadruple size)
      durabilitymode: Determines how armor durability is displayed (None = no durability text, Percentage = shows remaining durability as percentage, Absolute = shows remaining durability points)
      durabilitycolor: Sets the color for the durability text displayed next to armor items
      background: Enables a background panel behind the armor status display
      backgroundcolor: Sets the color of the background panel when BackGround is enabled
      dynamicarmorrendering: Only displays armor slots that contain armor items. When disabled, all 4 armor slots are always shown (even empty ones)
  minimap:
    description: Displays a minimap showing your surroundings in 2d topview
    settings:
      height: Sets the Y-level height for map rendering (0-255, blocks above this height are ignored)
      posx: Sets the horizontal position of the minimap on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the minimap on screen (0 = top edge, 100 = bottom edge)
      size: Sets the size of the minimap display in pixels (10-400)
      scale: Sets the zoom level of the minimap (50 = zoomed in, 400 = zoomed out)
      blur: Applies blur post-processing effect to the minimap rendering
      shadow: Applies shadow/bloom post-processing effect to the minimap rendering
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  skeletonesp:
    description: Renders skeleton outlines of players and entities to see their pose
    settings:
      entities: |
        Selects which entity types should have skeleton ESP rendered:
        - MySelf: Render your own skeleton in third-person view
        - Players: Render skeletons for other players
        - Mobs: Render skeletons for hostile mobs
        - Villager: Render skeletons for villagers
        - Invisible: Render skeletons for invisible entities
        - Teammates: Render skeletons for teammates
        - Friends: Render skeletons for friends
      headlengthadd: Adjusts the head bone length of the skeleton (-1 to 1)
      armlengthadd: Adjusts the arm bone length of the skeleton (-1 to 1)
      leglengthadd: Adjusts the leg bone length of the skeleton (-1 to 1)
      linewidth: Thickness of the skeleton lines (0.1-10)
      color: Color of the skeleton lines
      hurtcolorboolean: Enables alternative color when entity is taking damage
      hurtcolor: Color for skeleton when entity is hurt
      markmurderer: Highlights murderers in red in Murder Mystery gamemode (Murderfinder module required)
      custom murderer alpha: Enables custom transparency for murderer highlighting
      murderer alpha: Alpha transparency value for murderer highlighting (0-255)
      blur: Applies blur post-processing effect to skeleton rendering
      shadow: Applies shadow post-processing effect to skeleton rendering
      shadowcolorboolean: Enables custom shadow color instead of default
      shadowcolor: Color for the shadow effect
      hurtshadowcolorboolean: Enables alternative shadow color when entity is hurt
      hurtshadowcolor: Shadow color when entity is taking damage
  breakindicator:
    description: Shows a visual indicator of block breaking progress
    settings:
      decimalplaces: Sets the number of decimal places for the percentage display (0 = whole numbers only, 4 = four decimal places)
      scale: Controls the size scaling of the break indicator display (1 = normal size, 4 = quadruple size)
      posx: Sets the horizontal position of the break indicator on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the break indicator on screen (0 = top edge, 100 = bottom edge)
      color: Sets the RGB color for the percentage text displayed in the break indicator
      background: Enables a background rect behind the break indicator for better visibility
      backgroundcolor: Sets the RGB color and transparency of the background rect when BackGround is enabled
      blur: Applies blur post-processing effect to the break indicator for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the break indicator for enhanced visibility
      customshadowcolor: Enables custom shadow color for the break indicator instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
      toggleanimation: Selects the animation style used when the break indicator appears/disappears (None or various easing functions like easeInOutCubic)
      animationtime: Sets the duration of the toggle animation in milliseconds (0-1000)
  blockmarker:
    description: Highlights and marks specific blocks in the world based on absolute corrdinates
    settings:
      scripts: Selects a previously saved block marker script to load and display the marked block locations
      rendermode: |
        Controls when marked blocks should be rendered based on their current state:
        - Same block: Only render if the block at the marked position is still the same type
        - Different block (not air): Only render if the block has been replaced with a different non-air block
        - Different block (air): Only render if the block has been removed (air)
      render distance: Sets the maximum distance in blocks from the player where marked blocks will be rendered (0-200)
      color: Sets the RGB color and transparency of the overlay highlighting the marked blocks
      blur: Applies blur post-processing effect to the marked block overlays for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the marked block overlays for enhanced visibility
      open folder: Opens the blockmarker folder where script files are stored and can be managed
      name of new script: Sets the name for a new block marker script to be created
      blocks to add to script: Select which block types should be added to the script when scanning the area (multiselection from all Minecraft blocks)
      radius to fill: Sets the radius around the player in which blocks will be scanned and added to the script (0-200 blocks)
      create new script: Creates a new block marker script with the currently selected blocks within the specified radius
      add to selected script: Adds newly scanned blocks within the radius to the currently selected script file
      delete selected script: Permanently deletes the currently selected block marker script file
