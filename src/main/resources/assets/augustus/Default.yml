render:
  blur:
    description: Applies a blur effect on selected areas of your screen
    settings:
      modesnew: |
        Selects the blur algorithm used for rendering the effect:
        - Kawase: High-quality blur with excellent performance and smooth results
        - Gaussian: Classic bell-curve blur providing natural-looking softness
        - Box: Simple averaging blur algorithm, fastest but lower quality
      sigma: Controls the intensity and radius of the blur effect (4 = subtle blur, 30 = very strong blur)
      inscreens: Also blur areas of screens in the main menu and augustus menu
      blurentities: Enables blur effect rendering on entities in the game world
      entities: |
        Select which entity types should have the blur effect applied:
        - Myself: Apply blur to your own player model
        - Players: Apply blur to other players
        - Mobs: Apply blur to hostile mobs
        - Animals: Apply blur to passive animals
        - ArmorStands: Apply blur to armor stands
        - Villager: Apply blur to villagers
        - Invisible: Apply blur to invisible entities
      itemstoblur: |
        Select which item types should have the blur effect applied:
        - ItemsOnGround: Apply blur to dropped items on the ground
        - ItemsInHand: Apply blur to items held in your hand
        - ItemsInHotbar: Apply blur to items displayed in your hotbar
  shadow:
    description: Applies a bloom effect on selected areas of your screen
    settings:
      customcolor: Enables custom color for the shadow/bloom effect
      color: Sets the RGB color applied to the shadow effect
      sigma: Controls the spread intensity of the shadow (higher = more spread)
      shadowentities: Applies shadow effect to entities in the game
      entities: |
        Selects which entity types receive the shadow effect:
        - Myself: Apply shadow to your own player
        - Players: Apply shadow to other players
        - Mobs: Apply shadow to hostile mobs
        - Animals: Apply shadow to passive animals
        - ArmorStands: Apply shadow to armor stands
        - Villager: Apply shadow to villagers
        - Invisible: Apply shadow to invisible entities
      itemstoshadow: |
        Selects which items receive the shadow effect:
        - ItemsOnGround: Apply shadow to dropped items
        - ItemsInHand: Apply shadow to items held in your hand
        - ItemsInHotbar: Apply shadow to items in your hotbar
  customclientcolor:
    description: Allows customization of the client's color scheme for various interface
      elements
    settings:
      colorsetting: Sets the RGB color used as the primary client theme color for various interface elements
  arraylist:
    description: Displays a list of all toggled modules
    settings:
      x-pos: Sets the horizontal position of the ArrayList on screen (0 = left edge, 100 = right edge)
      y-pos: Sets the vertical position of the ArrayList on screen (0 = top edge, 100 = bottom edge)
      side: Determines which side of the screen the ArrayList is aligned to (Left or Right)
      sorting: Controls how modules are sorted in the list (Alphabet = alphabetically, Length = by text length)
      suffix: Determines the format of setting suffixes displayed after module names (None, Simple, Dash, Bracket, Colon, Custom)
      customsuffix: Sets a custom suffix text when Suffix mode is set to Custom
      suffixcasing: Controls the text casing of the suffix (Default = unchanged, UpperCase = all uppercase, LowerCase = all lowercase)
      casing: Controls the text casing of module names (Default = unchanged, UpperCase = all uppercase, LowerCase = all lowercase)
      spacing: Enables additional spacing between characters in the ArrayList text
      suffixcolor: Sets the RGB color for the suffix text displayed after module names
      randomcolor: Enables random color mode where each module gets its own color instead of using CustomColor
      customcolor: Sets the RGB color for module names when RandomColor is disabled
      backgound: Enables a background rect behind the ArrayList for better visibility
      backgroundcolor: Sets the RGB color and transparency of the background rect when BackGround is enabled
      line: Enables a colored line on the side of the ArrayList
      linewidth: Sets the width of the line in pixels when Line is enabled (0-10)
      linegap: Sets the gap distance between the line and the module text (0-10)
      customlinecolor: Enables custom color for the line instead of using module colors
      linecolor: Sets the RGB color for the line when CustomLineColor is enabled
      font: Selects the font type for the ArrayList text (Minecraft, Verdana, Arial, Roboto, Comfortaa, Esp, GoldBil, Jello, ProductSans, MuseoSans, Borel, Rubik, RubikBold, Tahoma, TahomaBold, or custom fonts)
      opencustomfontfolder: Opens the custom font folder where you can add your own .ttf font files
      bold: Enables bold text rendering when using Minecraft font
      verticalspacing: Adjusts the vertical spacing between module entries in the list (-5 to 5)
      scale: Controls the size scaling of the ArrayList when using Minecraft font (0.5 = half size, 4 = quadruple size)
      fontsize: Sets the font size in points when using custom fonts (16-80)
      fontshadow: Enables shadow rendering behind the text for better readability
      toggleanimation: Selects the animation style used when modules are toggled on/off (None or various easing functions like easeInOutBack)
      animationtime: Sets the duration of toggle animations in milliseconds (0-2000)
  clickgui:
    description: Provides a graphical user interface (GUI) for configuring and activating
      the different modules
    settings:
      sorting: |
        Sorts modules in ClickGui categories:
        - Random: Modules in their initialization order
        - Length: Modules sorted by text length descending
        - Alphabet: Modules sorted alphabetically
      germanmode: Every module name is in German
      openininventory: Allows opening the ClickGui even when an inventory screen is open
      clickguiblur: Add the blur effect to ClickGui. Only works if Blur module is
        enabled
      clickguishadow: Add the shadow effect to ClickGui. Only works if Shadow module
        is enabled
      clickguicustomshadowcolor: Enables custom shadow color for the ClickGui instead of using the default shadow color
      clickguicustomshadowcolorvalue: Sets the RGB color for the custom shadow effect when ClickGuiCustomShadowColor is enabled
      outline: Enables outline rendering in the ClickGui
      alpha: Set the transparency of the ClickGui
      dynamickeytime: Set the time for holding a key after you only have to release
        the key to toggle off the module
      descriptions: Go to "C:\Users\AppData\Roaming\ElectricLauncher\data\data\augustus\augustus\settings\descriptions"
        to add different descriptions
      settingnames: Selects different setting name configurations from the settings/settingnames folder
      moduledescriptions: Show all available descriptions for modules
      settingdescriptions: Show all available descriptions for settings
  attackeffects:
