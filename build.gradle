// --- Standard MCP Gradle tasks ---

def nativesDir = layout.buildDirectory.dir('natives')
def runDir = file("${projectDir}/run")
def defaultAssetsDir = project.hasProperty('assetsDir')
        ? file(project.property('assetsDir'))
        : new File(runDir, 'assets')

def extractNatives = tasks.register('extractNatives', Sync) {
    group = 'minecraft'
    description = 'Extracts LWJGL and JInput native libraries for the current OS.'
    into nativesDir
    from {
        configurations.natives.resolve().collect { zipTree(it) }
    }
    exclude 'META-INF/**'
}

tasks.named('classes') {
    dependsOn extractNatives
}

def downloadAssets = tasks.register('downloadAssets') {
    group = 'minecraft'
    description = 'Downloads the Minecraft 1.8 asset index and missing asset objects into run/assets.'
    onlyIf { !project.hasProperty('skipAssets') }

    doLast {
        def assetsDir = defaultAssetsDir
        def indexesDir = new File(assetsDir, 'indexes')
        def objectsDir = new File(assetsDir, 'objects')
        indexesDir.mkdirs()
        objectsDir.mkdirs()

        def indexFile = new File(indexesDir, '1.8.json')
        if (!indexFile.exists()) {
            logger.lifecycle('Downloading Minecraft 1.8 asset index...')
            def manifestUrl = new URL('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json')
            def manifest = new groovy.json.JsonSlurper().parse(manifestUrl)
            def v189 = manifest.versions.find { it.id == '1.8.9' }
            if (v189 == null) {
                throw new GradleException('Could not locate Minecraft 1.8.9 in Mojang version manifest.')
            }
            def versionMeta = new groovy.json.JsonSlurper().parse(new URL(v189.url))
            def assetIndexUrl = new URL(versionMeta.assetIndex.url)
            indexFile.bytes = assetIndexUrl.bytes
        }

        def indexJson = new groovy.json.JsonSlurper().parse(indexFile)
        def objects = indexJson.objects as Map<String, Map>
        def missing = []
        objects.each { name, info ->
            String hash = info.hash
            String prefix = hash.substring(0, 2)
            File target = new File(objectsDir, "${prefix}/${hash}")
            if (!target.exists() || target.length() != (info.size as long)) {
                missing << [hash: hash, prefix: prefix, target: target]
            }
        }

        if (!missing.isEmpty()) {
            logger.lifecycle("Downloading ${missing.size()} missing Minecraft 1.8 assets...")
            missing.each { entry ->
                File target = entry.target
                target.parentFile.mkdirs()
                def url = new URL("https://resources.download.minecraft.net/${entry.prefix}/${entry.hash}")
                url.withInputStream { input ->
                    target.withOutputStream { output -> output << input }
                }
            }
        }
    }
}

def prepareRunDir = tasks.register('prepareRunDir') {
    group = 'minecraft'
    description = 'Prepares the MCP run/ working directory.'
    doLast {
        runDir.mkdirs()
        defaultAssetsDir.mkdirs()
    }
}

tasks.register('runClient', JavaExec) {
    group = 'minecraft'
    description = 'Runs the Minecraft 1.8.9 OpenAugustus client.'
    dependsOn tasks.named('classes'), extractNatives, prepareRunDir, downloadAssets

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    mainClass = 'net.minecraft.client.main.Main'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = runDir

    jvmArgs "-Djava.library.path=${nativesDir.get().asFile.absolutePath}",
            "-Dorg.lwjgl.librarypath=${nativesDir.get().asFile.absolutePath}",
            "-Dnet.java.games.input.librarypath=${nativesDir.get().asFile.absolutePath}",
            '-Xms512m',
            '-Xmx2g'

    args '--version', '1.8.9',
         '--accessToken', '0',
         '--gameDir', runDir.absolutePath,
         '--assetsDir', defaultAssetsDir.absolutePath,
         '--assetIndex', '1.8',
         '--userProperties', '{}'

    if (project.hasProperty('username')) {
        args '--username', project.property('username').toString()
    }
}

tasks.register('runClientMinecraftDir', JavaExec) {
    group = 'minecraft'
    description = 'Runs OpenAugustus using the system .minecraft game and assets directory.'
    dependsOn tasks.named('classes'), extractNatives

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    }

    mainClass = 'StartMinecraftDirectory'
    classpath = sourceSets.main.runtimeClasspath
    workingDir = runDir

    jvmArgs "-Djava.library.path=${nativesDir.get().asFile.absolutePath}",
            "-Dorg.lwjgl.librarypath=${nativesDir.get().asFile.absolutePath}",
            "-Dnet.java.games.input.librarypath=${nativesDir.get().asFile.absolutePath}",
