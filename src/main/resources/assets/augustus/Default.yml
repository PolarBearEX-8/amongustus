  esp:
    description: Renders an in-game ESP (Extra Sensory Perception) overlay, showing
      the location of players or entities
    settings:
      modes: |
        Select which ESP rendering modes to use (can enable multiple):
        - Box: Renders entity bounding box outline
        - HitBox: Renders entity hit detection box outline
        - CollisionBox: Renders entity collision box outline
        - 3DCorner: Renders 3D corner markers at box edges
        - Real2D: Renders 2D filled boxes with outline on screen
        - Corner: Renders 2D corner markers on screen
        - Picture: Renders custom pictures over entities
        - Vanilla: Uses vanilla Minecraft entity glowing effect
      markmurderer: Highlights murderers in Murder Mystery gamemode with red color (MurderFinder module requiered)
      custom murderer alpha: Enables custom transparency for murderer highlighting instead of using the mode's alpha value
      murderer alpha: Sets the transparency for murderer highlighting when Custom Murderer Alpha is enabled (0-255)
      boxgroupygroupy: Settings group for configuring Box rendering mode
      teamcolorbox: Uses entity team colors instead of the custom color for Box mode
      boxcolor: Sets the RGB color and transparency for Box mode rendering
      boxhitcolorbool: Enables different color when entity is hurt in Box mode
      boxhitcolor: Sets the RGB color and transparency when entity is hurt in Box mode
      boxlinewidth: Sets the line width for Box mode outline rendering (0-15, automatically scales with distance)
      boxpriority: Sets the 3D rendering priority for Box mode to control layering order (0-3)
      boxblur: Applies blur post-processing effect to Box mode rendering
      boxshadow: Applies shadow/bloom post-processing effect to Box mode rendering
      boxcustomshadowcolor: Enables custom shadow color for Box mode instead of using the default shadow color
      boxcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in Box mode when BoxCustomShadowColor is enabled
      hitboxgroupygroupy: Settings group for configuring HitBox rendering mode
      hitboxteamcolor: Uses entity team colors instead of the custom color for HitBox mode
      hitboxcolor: Sets the RGB color and transparency for HitBox mode rendering
      hitboxhitcolorbool: Enables different color when entity is hurt in HitBox mode
      hitboxhitcolor: Sets the RGB color and transparency when entity is hurt in HitBox mode
      hitboxlinewidth: Sets the line width for HitBox mode outline rendering (0-15, automatically scales with distance)
      hitboxpriority: Sets the 3D rendering priority for HitBox mode to control layering order (0-3)
      hitboxblur: Applies blur post-processing effect to HitBox mode rendering
      hitboxshadow: Applies shadow/bloom post-processing effect to HitBox mode rendering
      hitboxcustomshadowcolor: Enables custom shadow color for HitBox mode instead of using the default shadow color
      hitboxcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in HitBox mode when HitBoxCustomShadowColor is enabled
      collisionboxgroupygroupy: Settings group for configuring CollisionBox rendering mode
      collisionboxteamcolor: Uses entity team colors instead of the custom color for CollisionBox mode
      collisionboxcolor: Sets the RGB color and transparency for CollisionBox mode rendering
      collisionboxhitcolorbool: Enables different color when entity is hurt in CollisionBox mode
      collisionboxhitcolor: Sets the RGB color and transparency when entity is hurt in CollisionBox mode
      collisionboxlinewidth: Sets the line width for CollisionBox mode outline rendering (0-15, automatically scales with distance)
      collisionboxpriority: Sets the 3D rendering priority for CollisionBox mode to control layering order (0-3)
      collisionboxblur: Applies blur post-processing effect to CollisionBox mode rendering
      collisionboxshadow: Applies shadow/bloom post-processing effect to CollisionBox mode rendering
      collisionboxcustomshadowcolor: Enables custom shadow color for CollisionBox mode instead of using the default shadow color
      collisionboxcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in CollisionBox mode when CollisionBoxCustomShadowColor is enabled
      3dcornergroupygroupy: Settings group for configuring 3DCorner rendering mode
      fakecornerteamcolor: Uses entity team colors instead of the custom color for 3DCorner mode
      fakecornercolor: Sets the RGB color and transparency for 3DCorner mode rendering
      fakecornerhitcolorbool: Enables different color when entity is hurt in 3DCorner mode
      fakecornerhitcolor: Sets the RGB color and transparency when entity is hurt in 3DCorner mode
      fakecornerpriority: Sets the 3D rendering priority for 3DCorner mode to control layering order (0-3)
      fakecornerblur: Applies blur post-processing effect to 3DCorner mode rendering
      fakecornershadow: Applies shadow/bloom post-processing effect to 3DCorner mode rendering
      fakecornercustomshadowcolor: Enables custom shadow color for 3DCorner mode instead of using the default shadow color
      fakecornercustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in 3DCorner mode when FakeCornerCustomShadowColor is enabled
      real2dgroupygroupy: Settings group for configuring Real2D rendering mode
      real2dteamcolor: Uses entity team colors instead of the custom color for Real2D mode outline
      real2dcolor1: Sets the RGB color and transparency for Real2D mode fill color
      real2dcolor2: Sets the RGB color for Real2D mode outline color
      real2dhitcolorbool: Enables different colors when entity is hurt in Real2D mode
      real2dhitcolor1: Sets the RGB color and transparency for Real2D mode fill color when entity is hurt
      real2dhitcolor2: Sets the RGB color for Real2D mode outline color when entity is hurt
      real2dpriority: Sets the 2D rendering priority for Real2D mode to control layering order (0-2)
      real2dblur: Applies blur post-processing effect to Real2D mode rendering
      real2dshadow: Applies shadow/bloom post-processing effect to Real2D mode rendering
      real2dcustomshadowcolor: Enables custom shadow color for Real2D mode instead of using the default shadow color
      real2dcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in Real2D mode when Real2DCustomShadowColor is enabled
      cornergroupygroupy: Settings group for configuring Corner rendering mode
      cornerteamcolor: Uses entity team colors instead of the custom color for Corner mode
      cornercolor: Sets the RGB color for Corner mode rendering
      cornerhitcolorbool: Enables different color when entity is hurt in Corner mode
      cornerhitcolor: Sets the RGB color when entity is hurt in Corner mode
      linewidthcorner: Sets the line width for Corner mode lines (1-5)
      horizontalpercentage: Sets the horizontal length of corner lines as percentage of entity width (1-100%)
      verticalpercentage: Sets the vertical length of corner lines as percentage of entity height (1-100%)
      cornerpriority: Sets the 2D rendering priority for Corner mode to control layering order (0-2)
      cornerblur: Applies blur post-processing effect to Corner mode rendering
      cornershadow: Applies shadow/bloom post-processing effect to Corner mode rendering
      cornercustomshadowcolor: Enables custom shadow color for Corner mode instead of using the default shadow color
      cornercustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in Corner mode when CornerCustomShadowColor is enabled
      picturegroupygroupy: Settings group for configuring Picture rendering mode
      picturepictures: Selects which picture file to display over entities from the pictures folder
      pictureypositionpercentage: Sets the vertical position of the picture within the entity box (0-100%, where 0 is top and 100 is bottom)
      picturepicturepriority: Sets the 2D rendering priority for Picture mode to control layering order (0-2)
      pictureblur: Applies blur post-processing effect to Picture mode rendering
      pictureshadow: Applies shadow/bloom post-processing effect to Picture mode rendering
      picturecustomshadowcolor: Enables custom shadow color for Picture mode instead of using the default shadow color
      picturecustomshadowcolorvalue: Sets the RGB color for the custom shadow effect in Picture mode when PictureCustomShadowColor is enabled
      picture folder: Opens the pictures folder where you can add custom .png, .jpg, or .jpeg image files
      vanillagroupygroupy: Settings group for configuring Vanilla rendering mode
      vanillateamcolor: Uses entity team colors instead of the custom color for Vanilla glowing effect
      vanillacolor: Sets the RGB color and transparency for Vanilla glowing effect
      vanillahitcolorbool: Enables different color when entity is hurt in Vanilla mode
      vanillahitcolor: Sets the RGB color and transparency when entity is hurt in Vanilla mode
      entities: |
        Select which entity types should be rendered with ESP:
        - Players: Render ESP for player entities
        - Mobs: Render ESP for hostile mobs
        - Villager: Render ESP for villagers
        - Animals: Render ESP for passive animals
        - Invisible: Render ESP for invisible entities
        - Teammates: Render ESP for Teammates
        - Friends: Render ESP for Friends
      maximumrenderdistance: Sets the maximum distance in blocks at which entities are rendered with ESP (0-500)
  storageesp:
    description: Provides an ESP overlay specifically for storage containers
    settings:
      modes: |
        Selects which ESP rendering modes should be active:
        - Box: 3D box outline around chests
        - BlockBox: 3D box aligned to block grid
        - 3DCorner: 3D corner indicators
        - Real2D: 2D overlay with fill and outline
        - Corner: 2D corner indicators
      boxgroupygroupy: Settings group for Box mode
      boxchestcolor: Color for regular chest boxes in Box mode
      boxenderchestcolor: Color for ender chest boxes in Box mode
      boxlinewidth: Thickness of box outline lines (0-12)
      boxexpand: Expands or contracts the box size (-1 to 1)
      boxpriority: Render priority for Box mode in 3D space (0-2)
      boxshaderblur: Applies blur post-processing to Box mode
      boxshadershadow: Applies shadow post-processing to Box mode
      boxshadercustomshadowcolor: Enables custom shadow color for Box mode
      boxshadercustomshadowcolorvalue: Sets custom shadow color when enabled
      blockboxgroupygroupy: Settings group for BlockBox mode
      blockboxchestcolor: Color for regular chest boxes in BlockBox mode
      blockboxenderchestcolor: Color for ender chest boxes in BlockBox mode
      blockboxlinewidth: Thickness of block box outline lines (0-12)
      blockboxpriority: Render priority for BlockBox mode in 3D space (0-2)
      blockboxshaderblur: Applies blur post-processing to BlockBox mode
      blockboxshadershadow: Applies shadow post-processing to BlockBox mode
      blockboxshadercustomshadowcolor: Enables custom shadow color for BlockBox mode
      blockboxshadercustomshadowcolorvalue: Sets custom shadow color when enabled
      3dcornergroupygroupy: Settings group for 3DCorner mode
      corner3chestcolor: Color for regular chest corners in 3DCorner mode
      corner3enderchestcolor: Color for ender chest corners in 3DCorner mode
      corner3dpriority: Render priority for 3DCorner mode in 3D space (0-2)
      corner3dshaderblur: Applies blur post-processing to 3DCorner mode
      corner3dshadershadow: Applies shadow post-processing to 3DCorner mode
      corner3dshadercustomshadowcolor: Enables custom shadow color for 3DCorner mode
      corner3dshadercustomshadowcolorvalue: Sets custom shadow color when enabled
      real2dgroupygroupy: Settings group for Real2D mode
      real2dcolorchest1: Primary fill color for regular chests in Real2D mode
      real2dcolorchest2: Outline color for regular chests in Real2D mode
      real2dcolorenderchest1: Primary fill color for ender chests in Real2D mode
      real2dcolorenderchest2: Outline color for ender chests in Real2D mode
      real2dpriority: Render priority for Real2D mode in 2D space (0-1)
      real2dshaderblur: Applies blur post-processing to Real2D mode
      real2dshadershadow: Applies shadow post-processing to Real2D mode
      real2dshadercustomshadowcolor: Enables custom shadow color for Real2D mode
      real2dshadercustomshadowcolorvalue: Sets custom shadow color when enabled
      cornergroupygroupy: Settings group for Corner mode
      cornerchestcolor: Color for regular chest corners in Corner mode
      cornerenderchestcolor: Color for ender chest corners in Corner mode
      cornerlinewidth: Thickness of corner lines (1-5)
      cornerhorizontalpercentage: Horizontal length of corner indicators (1-100%)
      cornerverticalpercentage: Vertical length of corner indicators (1-100%)
      cornerpriority: Render priority for Corner mode in 2D space (0-1)
      cornershaderblur: Applies blur post-processing to Corner mode
      cornershadershadow: Applies shadow post-processing to Corner mode
      cornershadercustomshadowcolor: Enables custom shadow color for Corner mode
      cornershadercustomshadowcolorvalue: Sets custom shadow color when enabled
      maxdistance: Maximum render distance for storage containers in chunks (0-32)
  blockanimation:
    description: Changes the animation for blocking
    settings:
      blockanimations: |
        Selects the visual style for block/sword animations:
        - None: Default vanilla blocking animation
        - 1.7: Classic 1.7 blocking style
        - Wiggle, Minimalistic, Swong, Jello, Exhibition, Exhibition2, Forward, Jigsaw, Violence, Sigma, Spin: Various custom animation styles
      height: Sets the vertical position offset of the blocking animation (-0.5 to 1.5, where 0.1 is slightly raised)
      fakeblock: Displays blocking animation even when not actually blocking with a sword
      onlywhilekillaura: Only shows the fake blocking animation while KillAura module is active (requires FakeBlock to be enabled)
      speed: Controls the speed of the blocking animation (0.1 = very slow, 3 = very fast)
  fullbright:
    description: Increases the brightness of the game world, making it easier to see
      in dark areas
    settings:
      mode: Wählt zwischen NightVision (Potion-Effekt) und Gamma (erhöhte Helligkeit)
      other: Aktiviert zusätzliche Fog-Helligkeit bei NightVision-Modus
  protector:
    description: Hides information like skin or name of players. Useful for youtube
      videos
    settings:
      time: Protects the time display by showing randomized coordinate and time values instead of real ones
      namegeneration: |
        Selects the method for generating protected player names:
        - List: Uses predefined names from a list
        - Esound: Generates names using Esound pattern
        - Generated: Creates randomly generated names
  nametags:
    description: Displays customizable nametags above players or entities in the game
      world
    settings:
      mode: |
        Selects the nametag rendering mode:
        - None: Disables nametag rendering completely
        - Vanilla: Uses Minecraft's default nametag rendering
        - Custom: Enables custom nametag rendering
      scale: Controls the size scaling of the nametags (0 = invisible, 3 = triple size)
      height: Adjusts the vertical offset of nametags relative to the entity (-3 = lower, 3 = higher)
      armor: Displays the player's equipped armor items above the nametag
      armordurability: Shows durability bars for armor items when Armor is enabled
      armorenchantments: Displays enchantment abbreviations on armor items when Armor is enabled
      potioneffects: Shows active potion effects on the player
      healthmode: |
        Selects the health information display mode:
        - None: No health display
        - Entity: Shows health from entity data
        - TabList: Shows health from tab list information
      ping: Displays the player's network latency in milliseconds
      throughwalls: Renders nametags even when the player is behind walls
      ignoreteammates: Hides nametags for players on your team
      myself: Renders your own nametag in third-person view
      invisible: Shows nametags for invisible players
      invisibleteam: Shows nametags for invisible teammates
      transparent: Removes the background box behind the nametag for a cleaner look
      shadow: Adds shadow effect to the nametag for better visibility
      shadowfont: Uses shadow font rendering when both Shadow and Transparent are enabled
      maximumrenderdistance: Sets the maximum distance in blocks to render nametags (0-500)
  hud:
    description: Renders the client name/logo
    settings:
      mode: |
        Selects the rendering style for the HUD logo:
        - None: No HUD rendering
        - Basic: Client name with version and time display
        - Other: Large stylized 'A' with 'ugustus' text
        - Simple: Clean text-only logo with customizable font size
        - Ausustus: Basic variant with 'Ausustus' spelling
        - Xave: Large uppercase text using custom font
        - Augustus: Full Augustus logo image
        - Amogus: Alternative logo image
        - Logo: Alternative logo variant
        - Fanart: Community fanart logo
      side: Determines which side of the screen the HUD is aligned to (Left or Right)
      casing: |
        Controls the text casing for Simple mode:
        - Default: Original casing
        - UpperCase: All uppercase letters
        - LowerCase: All lowercase letters
      x-pos: Sets the horizontal position of the HUD on screen (0 = left edge, 100 = right edge)
      y-pos: Sets the vertical position of the HUD on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the HUD for non-picture modes (1 = normal, 4 = quadruple size)
      size: Controls the size scaling for picture-based HUD modes (0.01 = tiny, 2 = double size)
      newfontsize: Sets the font size in points for Simple mode (16 = small, 80 = very large)
      color: Sets the RGB color for the HUD text in Basic, Other, Simple, Xave, and Ausustus modes
      background: Enables a background rectangle behind the HUD for better visibility in Basic, Other, Simple, and Ausustus modes
      roudedbackground: Enables rounded corners for the background rectangle when BackGround is enabled
      roundfactor: Sets the corner radius for the rounded background (1 = slightly rounded, 10 = very rounded)
      backgroundcolor: Sets the RGB color and transparency of the background rectangle when BackGround is enabled
      hudblur: Applies blur post-processing effect to the HUD background or picture for a softer appearance
      hudshadow: Applies shadow/bloom post-processing effect to the HUD for enhanced visibility
      hudcustomshadowcolor: Enables custom shadow color instead of using the default shadow color
      hudcustomshadowcolorvalue: Sets the RGB color for the shadow when HudCustomShadowColor is enabled
  tracers:
    description: Renders lines to enemies
    settings: {}
  itemesp:
    description: Provides an ESP overlay specifically for items
    settings:
      mode: |
        Selects the rendering mode for ItemESP:
        - Box: Renders a colored box around items
        - Vanilla: Uses Minecraft's default item highlighting
      boxcolor: Sets the RGB color for the box rendered around items when using Box mode
      render custom itemnames: Renders custom names for items on the ground
      apply nametags rendering: Applies nametag rendering settings to custom item names
      only show whitelisted items: Only highlights items that are selected in the whitelist
      whitelisted items: Select which item types should be highlighted by the ESP
  scoreboard:
    description: Customizes the in-game scoreboard, which shows player rankings or
      statistics
    settings:
      remove: Completely hides the scoreboard from the screen
      stick: Keeps the scoreboard at a dynamic position under the HUD and Arraylist
      transparent: Removes the background panel behind the scoreboard for a cleaner appearance
      fontshadow: Adds shadow effect to the scoreboard text for better readability
      rounded: Enables rounded corners for the scoreboard background panel
      roundfactor: Controls the radius of rounded corners when Rounded is enabled (0-8)
      positionx: Sets the horizontal position of the scoreboard on screen (0 = left edge, 100 = right edge)
      positiony: Sets the vertical position of the scoreboard on screen when Stick is disabled (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the scoreboard (1 = normal, 4 = quadruple size)
      blur: Applies blur post-processing effect to the scoreboard
      shadow: Applies shadow/bloom post-processing effect to the scoreboard
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  blockesp:
    description: Adds an ESP overlay specifically for blocks, highlighting their location
    settings:
      mode: |
        Selects the rendering mode for BlockESP:
        - Old: Traditional rendering with customizable line width and distance-based fading
        - New: Optimized batch rendering for better performance with many blocks
      color: Sets the RGB color for the ESP overlay highlighting selected blocks
      linewidth: Sets the width of the lines in the ESP overlay when using Old mode (0-15, automatically fades with distance)
      blur: Applies blur post-processing effect to the ESP overlay for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the ESP overlay for enhanced visibility
      blocks: Select which block types should be highlighted by the ESP (multiselection from all available Minecraft blocks)
  barriers:
    description: Replaces all barriers with a broken texture to make them visible
    settings: {}
  line:
    description: Render a line under you or for Killaura
    settings:
      movelinegroupygroupy: Settings group for configuring the movement line trail
      activatemoveline: Enables rendering a line trail that follows your movement path
      color: Sets the RGB color and transparency for the movement line trail
      linewidth: Sets the width of the movement line trail (0.1-4)
      linetime: Sets how long the movement line trail stays visible in milliseconds (500-20000)
      resetonteleportmoveline: Clears the movement line trail when you are teleported by the server
      auralinegroupygroupy: Settings group for configuring the KillAura rotation line
      activateauraline: Enables rendering a line showing KillAura rotation movements
      display legitimate rotations: Displays the actual rotation angles instead of smooth interpolation
      display rotations at current position: Renders rotation lines at your current position instead of where the rotation occurred
      auracolor: Sets the RGB color and transparency for the KillAura rotation line
      auralinewidth: Sets the width of the KillAura rotation line (0.1-4)
      auralinetime: Sets how long the KillAura rotation line stays visible in milliseconds (500-20000)
      resetonteleportauraline: Clears the KillAura rotation line when you are teleported by the server
      blur: Applies blur post-processing effect to the line rendering
      shadow: Applies shadow/bloom post-processing effect to the line rendering
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  ambiance:
    description: Change the time, worldcolor, fogcolor and more
    settings:
      time: Sets the visual world time (0-24000, where 12000 is approximately sunset)
      timespeed: Controls how fast the world time changes (0 = static, higher values = faster time progression)
      rain: Adjusts the rain intensity (0 = no rain, 1 = maximum rain strength)
      snow: Enables snow particles during rain instead of regular rain particles
      thunder: Controls the thunder intensity (0 = no thunder, 1 = maximum thunder strength)
      customworldcolor: Enables custom world lighting color instead of the default lighting
      worldcolor: Sets the RGB color for the world lighting when CustomWorldColor is enabled
      customfogcolor: Enables custom fog color instead of the default fog color
      fogcolor: Sets the RGB color for the fog when CustomFogColor is enabled
      customfogdistance: Enables custom fog rendering distance control
      fogdistance: Sets the fog rendering distance in blocks (higher values = fog starts further away)
  crosshair:
    description: Provides a customizable crosshair overlay for precise aiming in the
      game
    settings:
      defaultcrosshair: Uses the default Minecraft crosshair instead of a custom one
      thirdperson: Renders the crosshair even when in third-person view
      scale: Controls the size scaling of the default crosshair (1 = normal size, 4 = quadruple size, requires DefaultCrossHair enabled)
      color: Sets the RGB color for the custom crosshair (requires DefaultCrossHair disabled)
      length: Sets the length of the crosshair lines in pixels (0-40, requires DefaultCrossHair disabled)
      width: Sets the width/thickness of the crosshair lines in pixels (1-20, requires DefaultCrossHair disabled)
      margin: Sets the gap distance between the center and the crosshair lines (0-40, requires DefaultCrossHair disabled)
      dot: Enables a center dot in the middle of the crosshair (requires DefaultCrossHair disabled)
      t-style: Uses a T-shaped crosshair design without the bottom line (requires DefaultCrossHair disabled)
      shadow: Applies shadow/bloom post-processing effect to the crosshair for enhanced visibility (requires DefaultCrossHair disabled and Shadow module enabled)
  arrowhitboxes:
    description: Renders hitboxes around arrows
    settings: {}
  trajectories:
    description: Displays the trajectory of projectiles you are throwing, such as
      bows or throwable items
    settings: {}
  projectiles:
    description: Displays the trajectory of projectiles from other players, such as
      arrows or throwable items
    settings:
      color: Sets the RGB color for the projectile trajectory line
      calculatecolor: Dynamically adjusts the trajectory color based on distance to the player
      linewidth: Controls the thickness of the projectile trajectory line (1 = thin, 12 = thick)
      blur: Applies blur post-processing effect to the trajectory rendering
      shadow: Applies shadow/bloom post-processing effect to the trajectory rendering
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
      items: |
        Select which projectile types should have their trajectory displayed:
        - Arrow: Show trajectory for arrows
        - EnderPearl: Show trajectory for ender pearls
        - Egg: Show trajectory for thrown eggs
        - SnowBall: Show trajectory for snowballs
        - XPBottle: Show trajectory for experience bottles
        - Potion: Show trajectory for splash potions
        - FireBall: Show trajectory for fireballs
  customglint:
    description: Adds a customized glint effect to items in the game
    settings:
      remove: Completely removes the enchantment glint effect from all items
      brighterenchantments: Makes the enchantment glint effect brighter and more visible
      customcolor: Enables custom color for the enchantment glint effect instead of the default purple
      color: Sets the RGB color for the custom enchantment glint when CustomColor is enabled
      fakeenchant: Select which item types should display a fake enchantment glint (Swords, Tools, Armor, Rest)
      speed: Controls the animation speed of the glint effect (0.01 = very slow, 10 = very fast)
  customitempos:
    description: Allows customization of the position of items in the player's hand
    settings:
      x: Sets the horizontal X position offset of the held item (-1 = far left, 1 = far right)
      y: Sets the vertical Y position offset of the held item (-1 = lower, 1 = higher)
      z: Sets the depth Z position offset of the held item (-1 = further away, 1 = closer to screen)
      blockx: Sets the horizontal X position offset when blocking with an item (-1 = far left, 1 = far right)
      blocky: Sets the vertical Y position offset when blocking with an item (-1 = lower, 1 = higher)
      blockz: Sets the depth Z position offset when blocking with an item (-1 = further away, 1 = closer to screen)
      scale: Controls the size scaling of the held item (0 = invisible, 2 = double size)
      lefthand: Renders the held item in the left hand instead of the right hand
  oldnotification:
    description: Displays the old notifications (deprecated)
    settings:
      modes: |
        Selects the notification display style:
        - Windows: Uses native Windows system notifications
        - Basic: Custom in-game notification overlay
      side: Determines which side of the screen notifications appear on (Left or Right, Basic mode only)
      y: Sets the vertical position of notifications as percentage of screen height (0-100%, Basic mode only)
      animationtime: Sets the duration of the slide-in/out animation in milliseconds (0-1000, Basic mode only)
      animationduration: Sets how long the notification stays visible in milliseconds (0-5000, Basic mode only)
      color: Sets the RGB color for the notification background (Basic mode only)
      blur: Applies blur post-processing effect to the notification rendering
      shadow: Applies shadow/bloom post-processing effect to the notification rendering
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  entitycolor:
    description: Customizes the color of specific entities in the game world
    settings:
      hitcolor: Sets the RGB color and transparency overlay applied to entities when they take damage
      hitcoloranimation: Selects the easing function for the hit color fade animation (easeInSine, linear, easeInOutCubic, etc.)
      reverseanimation: Reverses the animation direction from fade-out to fade-in when enabled
      color: Sets the RGB color and transparency overlay applied to entities when not damaged
  chams:
    description: Render entities and chests through walls
    settings:
      entities: |
        Select which entity types should be rendered through walls:
        - Players: Render players through walls
        - Mobs: Render hostile mobs through walls
        - Animals: Render passive animals through walls
        - ArmorStands: Render armor stands through walls
        - Villager: Render villagers through walls
        - Invisible: Render invisible entities through walls
        - Teammates: Exclude teammates from rendering through walls
        - Friends: Exclude friends from rendering through walls
      coloredentitychams: Enables colored overlay rendering for entities instead of default texture-based chams
      onlythroughwallsentities: Only render the colored entity chams when the entity is behind a wall (requires ColoredEntityChams enabled)
      rendertextureentity: Renders the default entity texture in addition to the color overlay (requires ColoredEntityChams enabled)
      colorentity: Sets the RGB color and transparency for the entity chams overlay (requires ColoredEntityChams enabled)
      chests: Enables chams rendering for chest blocks to see them through walls
      coloredchestchams: Enables colored overlay rendering for chests instead of default texture-based chams (requires Chests enabled)
      onlythroughwalls: Only render the colored chest chams when the chest is behind a wall (requires ColoredChestChams enabled)
      rendertexture: Renders the default chest texture in addition to the color overlay (requires ColoredChestChams enabled)
      colorchest: Sets the RGB color and transparency for normal chest chams overlay (requires ColoredChestChams enabled)
      colorenderchest: Sets the RGB color and transparency for ender chest chams overlay (requires ColoredChestChams enabled)
  chunkanimator:
    description: Animates the appearance of newly loaded chunks in the world
    settings:
      mode: |
        Selects the direction from which chunks appear:
        - Below: Chunks rise up from below their final position
        - Above: Chunks drop down from above their final position
        - Horizon: Chunks below world horizon rise up, chunks above drop down
        - Cardinal: Chunks slide in from cardinal directions (North, South, East, West)
        - Variation: Enhanced variation of the Cardinal animation mode
      animation: Selects the easing function for smooth chunk animations (easeOutBack, linear, easeInOutCubic, etc.)
      animationtime: Sets the duration of the chunk appearance animation in milliseconds (0-2000, where 500 is smooth and 0 disables animation)
      disablearoundplayer: Disables chunk animations within a 64-block radius around the player to reduce visual distraction in nearby areas
  legacyanimations:
    description: Reenables legacy animations, providing a nostalgic visual experience
    settings:
      heartanimationmode: |
        Controls the visual style of the health bar animation:
        - Default: Modern health animation
        - Legacy: Classic 1.7 health animation
        - Minimal: Minimal health animation without shaking
      damageanimation: Reenables the legacy damage animation when taking hits
      itemheld: Reenables the legacy item holding position and animation
      swing: Reenables the legacy swing animation when attacking with items
      debughitbox: Reenables the legacy debug hitbox rendering style
      rod: Reenables the legacy fishing rod animation
  blockoverlay:
    description: Allows custumization of the block overlay
    settings:
      color: Sets the RGB color for the block overlay highlighting the targeted block
      blackline: Renders the outline of the block in black instead of using the custom color
      blockfill: Enables filling the inside of the targeted block with a semi-transparent overlay
      linewidth: Sets the width of the outline around the targeted block (0-10, where 0 disables the outline)
      inadventuremode: Enables the block overlay to work in Adventure mode in addition to Survival and Creative modes
      onlyblockface: Only renders the overlay on the specific face of the block you are looking at instead of the entire block
      blur: Applies blur post-processing effect to the block overlay
      shadow: Applies shadow/bloom post-processing effect to the block overlay
  coordinates:
    description: Displays the player's current position in the game world
    settings:
      posx: Sets the horizontal position of the coordinates display on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the coordinates display on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the coordinates display (1 = normal size, 4 = quadruple size)
      color1: Sets the RGB color for coordinate labels (X:, Y:, Z:)
      color2: Sets the RGB color for the actual coordinate values
      background: Enables a background rect behind the coordinates display for better visibility
      backgroundcolor: Sets the RGB color and transparency of the background rect when BackGround is enabled
      backgroundblur: Applies blur post-processing effect to the coordinates background for a softer appearance
      backgroundshadow: Applies shadow/bloom post-processing effect to the coordinates background for enhanced visibility
      backgroundcustomshadowcolor: Enables custom shadow color for the coordinates background instead of using the default shadow color
      backgroundcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect when BackGroundCustomShadowColor is enabled
  antihurtcam:
    description: Prevents camera movements caused by taking damage
    settings: {}
  customname:
    description: Allows customization of your name. You can set it with a abstractCommand
    settings:
      modes: |
        Selects the source for your displayed name:
        - AugustusName: Uses your Augustus client username
        - IngameName: Uses your current Minecraft session username
        - PCName: Uses your computer's system username
        - Custom: Allows you to set a custom name via the Custom name setting
      name-formatting: Selects the visual formatting style for the displayed name (Xanax, Xanax2, Centaurus, Centaurus2, Skid, Simple)
      custom name: Sets the custom name text when Modes is set to Custom
  antiinvisibles:
    description: Makes invisible entities visible
    settings:
      entities: Select which entity types should be rendered when invisible (Player, Mob, Animal, Villager, ArmorStand)
  fovarrows:
    description: Renders arrows at the around the crosshair show the direction of
      entities
    settings:
      maxtargetdistance: Sets the maximum distance in blocks to detect and display targets with arrows (1-30)
      crosshairdistance: Controls the distance of the arrows from the center crosshair (0-50)
      scale: Adjusts the size scaling of the rendered arrows (1 = normal, 4 = quadruple size)
      color: Sets the RGB color for the directional arrows
      distalpha: Enables distance-based transparency where closer targets are more opaque and distant targets more transparent
      distcolor: Enables distance-based color gradient where color shifts from green (close) to red (far)
      rendernames: Displays player names next to the directional arrows
      outline: Enables outline rendering around the arrows for enhanced visibility
      differentoutlinecolor: Uses a separate custom color for the arrow outline instead of the arrow color
      outlinecolor: Sets the RGB color for the arrow outline when DifferentOutlineColor is enabled
      blur: Applies blur post-processing effect to the arrows
      shadow: Applies shadow/bloom post-processing effect to the arrows
      customshadowcolor: Enables custom shadow color for the arrows instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  keystrokes:
    description: Displays the player's keyboard input on the screen
    settings:
      backgroundcolor: Sets the background color for unpressed keys
      backgroundcolorpressed: Sets the background color when a key is pressed
      keycolor: Sets the text color for unpressed keys
      keycolorpressed: Sets the text color when a key is pressed
      scale: Controls the size scaling of the keystroke display (1 = normal, 4 = quadruple size)
      fadespeed: Sets the duration of the color fade animation when pressing/releasing keys in milliseconds (0 = instant, 1000 = 1 second)
      x: Sets the horizontal position of the keystroke display on screen (0 = left edge, 100 = right edge)
      y: Sets the vertical position of the keystroke display on screen (0 = top edge, 100 = bottom edge)
      blur: Applies blur post-processing effect to the keystroke display
      shadow: Applies shadow/bloom post-processing effect to the keystroke display
      customshadowcolor: Enables custom shadow color for the keystroke display instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  itemphysics:
    description: Adds physics-based movements to items in the game world
    settings:
      rotate: Enables continuous rotation of items while they are in the air
  antiblind:
    description: Removes blindness in the game
    settings: {}
  invismode:
    description: Let the client look more legit
    settings:
      disable custom escape menu: Disables the custom Augustus escape menu and uses the vanilla Minecraft pause menu instead
      disable custom main menu: Disables the custom Augustus main menu and uses the vanilla Minecraft title screen instead
  targethud:
    description: Displays information about the targert
    settings:
      modes: |
        Selects the visual style for the target HUD display
        Minecraft = Traditional style with armor display
        Modern = Sleek minimalist design
        LiquidGlass = Glassmorphism design with gradients
      modesmodevaluesgroupgroupygroupy: Internal mode values group setting
      healthmode: |
        Determines how health is calculated
        Entity = Uses entity's direct health value
        Scoreboard = Reads health from scoreboard (for servers with custom health display)
      trackentity: Makes the HUD follow the target entity's position in 3D space instead of using fixed coordinates
      tracky: Vertical offset adjustment for entity tracking mode (-2 to 2)
      xcoord: Horizontal screen position when trackentity is disabled (0 = left edge, 100 = right edge)
      ycoord: Vertical screen position when trackentity is disabled (0 = top edge, 100 = bottom edge)
      toggleanimation: Animation easing function used when target appears or disappears
      animationtime: Duration of toggle animation in milliseconds (0-2000ms)
      blur: Enables blur shader effect on the HUD background
      shadow: Enables shadow/bloom shader effect on the HUD
      customshadowcolor: Enables custom color for shadow instead of default black
      customshadowcolorvalue: RGB color value for custom shadow (requires customshadowcolor enabled)
      minecraftscale: Size multiplier for Minecraft mode HUD (0.1-2.0, default = 1.0)
      minecraftbackgroundcolor: Background panel color for Minecraft mode
      minecrafthealthbackgroundcolor: Health bar background track color for Minecraft mode
      minecrafthealthcolor: Health bar fill color for Minecraft mode
      minecrafttextcolor: Player name text color for Minecraft mode
      modernbackgroundcolor: Background panel color for Modern mode
      modernhealthbackgroundcolor: Health bar background track color for Modern mode
      modernhealthcolor: Health bar fill color for Modern mode
      modernheaddamagecolor: Hurt overlay color that appears on player head when taking damage (Modern mode)
      moderntextcolor: Player name text color for Modern mode
      liquidglassglasscolor: Glassmorphism background effect color for LiquidGlass mode
      liquidglassbordercolor: Border color around the glass panel for LiquidGlass mode
      liquidglasshealthgradientstart: Health bar gradient start color for LiquidGlass mode
      liquidglasshealthgradientend: Health bar gradient end color for LiquidGlass mode
      liquidglasshealthbackgroundcolor: Health bar background track color for LiquidGlass mode
      liquidglasstextcolor: Player name text color for LiquidGlass mode
      liquidglassglowcolor: Glow effect color around player head for LiquidGlass mode (turns red when damaged)
  customskin:
    description: Allows to replaceme the player's skin
    settings:
      skinmode: Selects the skin model type (default = classic model with 4px arms, slim = slim model with 3px arms)
      skins: Selects which custom skin file to use from the customskins folder (requires 64x64 or 64x32 PNG files)
      openfolder: Opens the customskins folder where you can add your own .png skin files
  customcape:
    description: Allows customization or addition of a custom cape for the player
      character
    settings:
      type: Selects the cape type source (LabyMod = custom cape files, Mojang = official Minecraft capes)
      labymodcapes: Selects which custom cape design to use from the LabyMod cape folder (requires Type = LabyMod)
      openfolder: Opens the custom cape folder where you can add your own .png cape files (requires Type = LabyMod)
      mojangcapes: Selects which official Mojang cape design to use from available Minecraft capes (requires Type = Mojang)
      physics: Enables realistic physics simulation for cape movement based on player motion
      gravity: Controls the gravitational force pulling the cape downward (0 = no gravity, 2 = double gravity)
      stiffness: Controls how rigid the cape fabric behaves (0.1 = very flexible/floppy, 1 = very stiff/rigid)
      damping: Controls the cape motion dampening to reduce oscillation (0.5 = bouncy movement, 1 = heavily dampened/smooth)
      turnstrength: Controls how strongly the cape reacts to player rotation and turning movements (0 = no reaction, 1 = maximum reaction)
      jumpstrength: Controls how strongly the cape reacts to player jumping movements (0 = no reaction, 1 = maximum reaction)
      walkingstrength: Controls how strongly the cape reacts to player walking movements (0 = no reaction, 1 = maximum reaction)
      waveatwalking: Enables wave-like motion animation on the cape while walking for more realistic fabric movement
  customcamera:
    description: Enables customization of the camera perspective or view in the game
    settings:
      customheight: Adjusts the vertical camera eye height position in first-person view (-5 = lower, 10 = higher)
      customheightf5: Adjusts the vertical camera eye height position in third-person front view/F5 mode (-5 = lower, 10 = higher)
      customx: Shifts the camera horizontally along the X-axis in first-person view (-5 = left, 5 = right)
      customxf5: Shifts the camera horizontally along the X-axis in third-person front view/F5 mode (-5 = left, 5 = right)
      customz: Shifts the camera horizontally along the Z-axis in first-person view (-5 = backward, 5 = forward)
      customzf5: Shifts the camera horizontally along the Z-axis in third-person front view/F5 mode (-5 = backward, 5 = forward)
      customthirdpersondistance: Sets the camera distance from the player in third-person view (0 = closest, 30 = farthest, default 4)
  tablist:
    description: Customize the in-game tab list, which shows player names and statuses
    settings:
      remove: Completely removes the tab list from being rendered on screen
      scale: Controls the size scaling of the tab list display (1 = normal size, 4 = quadruple size)
      pingnumber: Displays ping numbers next to player names in the tab list
      alwaysopen: Keeps the tab list always visible without holding the tab key
      fontshadow: Enables shadow rendering behind player names for better readability
      rowsize: Sets the maximum number of rows/players to display in the tab list (10-200)
      columnsize: Sets the maximum number of columns in the tab list layout (1-200)
      blur: Applies blur post-processing effect to the tab list background for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the tab list for enhanced visibility
      customshadowcolor: Enables custom shadow color instead of using the default black shadow
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  chat:
    description: Customizes the appearance of the in-game chat interface
    settings:
      remove: Completely removes the chat from being rendered on screen
      nochatlimit: Removes the limitation on the number of chat messages that can be displayed (requires Remove disabled)
      fontshadow: Enables shadow rendering behind chat text for better readability (requires Remove disabled)
      background: Enables background rendering behind chat messages for better visibility (requires Remove disabled)
      custombackgroundcolor: Enables custom background color instead of the default color (requires BackGround enabled)
      backgroundcolor: Sets the RGB color and transparency for the chat background when CustomBackGroundColor is enabled
      blur: Applies blur post-processing effect to the chat background for a softer appearance (requires BackGround enabled)
      shadow: Applies shadow/bloom post-processing effect to the chat background for enhanced visibility (requires BackGround enabled)
      customshadowcolor: Enables custom shadow color for the chat background instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  antistrike:
    description: Provides protection against strikes on social media (hides player
      names, item names, chat, tablist and more)
    settings:
      components to hide: Select which UI components should be hidden or censored (Chat, TabList, Scoreboard, ItemNames, NameTags, ToolTips, Signs, Title, Books, ChestNames, Maps)
      replace server name: Replaces the server name with a generic placeholder to hide server identity
      remove color codes: Removes all color codes from displayed text from the server for additional strike protection
  noarmoroverlay:
    description: Removes the armor on players
    settings:
      armortypes: Selects which armor pieces to hide on players (Helmet, ChestPlate, Trousers, Boots)
  model:
    description: Shows a model of yourself on the screen like in the inventory
    settings:
      x-coord: Sets the horizontal position of the player model on screen (0 = left edge, 100 = right edge)
      y-coord: Sets the vertical position of the player model on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the rendered player model (10 = small, 100 = large)
      yawrot: Enables dynamic rotation animation based on the player's yaw movement changes
  renderpotion:
    description: Displays your current potion effects
    settings:
      x-coord: Sets the horizontal position of the potion display on screen (0 = left edge, 100 = right edge)
      y-coord: Sets the vertical position of the potion display on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the potion effect display (0.5 = half size, 4 = quadruple size)
      margin: Sets the vertical spacing between individual potion effects in the list (0-10)
      backgroundcolor: Sets the RGB color and transparency for the background panel behind each potion effect
      blur: Applies blur post-processing effect to the potion display
      shadow: Applies shadow/bloom post-processing effect to the potion display
      customshadowcolor: Enables custom shadow color instead of using the default shadow color
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
  particle:
    description: Adds custom particles under you
    settings: {}
  customzoom:
    description: Allows customization of the zoom level and smoothing
    settings:
      zoomfactor: Controls the strength of the zoom effect when the zoom key is pressed (1 = no zoom, 10 = maximum zoom)
      animationmodes: Selects the easing function for smooth zoom-in and zoom-out animations (easeOutQuint, linear, etc.)
      animationtime: Sets the duration of the zoom animation in milliseconds (0 = instant zoom, 1000 = 1 second animation)
      fastzoom: Disables the smoothing of the mouse inputs while zooming
  movecircles:
    description: Renders circles under you while jumping
    settings:
      circleradius: Controls the radius of the rendered circles in blocks (0.1 = small, 3 = large)
      circlewidth: Sets the line width of the circle outline (0.1 = thin, 7 = thick)
      circlecolor: Sets the RGB color for the rendered circles
      circleanimation: Selects the easing function for the circle expansion animation (easeInSine, linear, etc.)
      animationtime: Sets the duration of the circle expansion animation in milliseconds (50 = fast, 1500 = slow)
      fadeout: Enables fade-out effect when the circle reaches full size
      fadeoutanimation: Selects the easing function for the fade-out animation when FadeOut is enabled (easeInSine, linear, etc.)
      fadeouttime: Sets the duration of the fade-out animation in milliseconds when FadeOut is enabled (50 = fast, 1500 = slow)
      ticksbetweencircles: Sets the delay in ticks between spawning consecutive circles (0 = every tick, 10 = slower)
      onlyafterjump: Only spawns circles after landing from a jump instead of continuously while moving
  centredinventory:
    description: Centers the player's inventory
    settings: {}
  tntesp:
    description: Provides an ESP overlay specifically for TNT blocks, includes explosion
      radius and damage
    settings:
      color: RGBA color for the main TNT sphere ESP overlay (8-block explosion radius)
      deathcircle: Enables rendering of a secondary sphere showing the radius at which the explosion would kill the player
      deathcolor: RGBA color for the death radius sphere (requires deathcircle enabled)
      smoothness: Controls sphere polygon count and quality (8-60, higher values = smoother spheres but may impact performance)
      displaydamage: Enables on-screen text display showing total potential damage from all visible TNT entities
      x-coord: Horizontal screen position for damage display text (0 = left edge, 100 = right edge)
      y-coord: Vertical screen position for damage display text (0 = top edge, 100 = bottom edge)
  child:
    description: Everyone is a child
    settings:
      editeyeheight: Lowers camera eye height to 0.85f for a child-like perspective in first person
      removecapes: Removes cape rendering from all players
  fovmodifier:
    description: Modify the field of view (FOV)
    settings:
      ignoredynamicfov: Disables vanilla's dynamic FOV changes (sprinting, bow drawing, speed effects)
      defaultfov: Sets the field of view when in default state (30-150)
      sprintfov: Sets the field of view when sprinting (30-150)
      speedfov: Sets the field of view when speed effect is active (30-150)
      animationmodes: Selects the easing function for smooth FOV transitions (easeOutQuint, linear, etc.)
      animationtime: Sets the duration of FOV transition animations in milliseconds (1-1000)
  targetesp:
    description: Provides an ESP overlay specifically for targeted entitie,
    settings:
      modules: Select which modules should trigger the ESP display (KillAura, AimBot, AimAssist, AutoRod, Legit)
      mode: |
        Selects the rendering style for the target ESP:
        - None: Disables ESP rendering
        - Box: Renders a box above the target's head
        - Sigma: Renders an animated circular wave around the target
      targetespcolor: Sets the RGB color for the ESP overlay when target is not hurt
      hitcolor: Enables different color when target takes damage
      targetesphitcolor: Sets the RGB color for the ESP overlay when target is hurt (requires HitColor enabled)
      linewidth: Sets the outline thickness for Box mode bounding box (0-12)
      adjustwidth: Adjusts the width of the Box mode bounding box (-1 = narrower, 1 = wider)
      height: Sets the height of the Box mode bounding box (0-0.5)
      adjustypos: Adjusts the vertical position of the Box relative to target's head (-2 = lower, 2 = higher)
      speed: Controls the animation wave speed for Sigma mode (0 = static, 2 = fast)
      length: Controls the vertical wave amplitude for Sigma mode animation (0 = flat, 2 = tall)
      additionalradius: Adjusts the circle radius size for Sigma mode (-1 = smaller, 2 = larger)
      blur: Applies blur post-processing effect to the ESP overlay for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the ESP for enhanced visibility
      customshadowcolor: Enables custom shadow color instead of using the default black shadow
      customshadowcolorvalue: Sets the RGB color for the custom shadow effect when CustomShadowColor is enabled
      critvisualizer: Displays "Crit!" or "Hit!" text at the hit location when attacking
      critvisualizercolor: Sets the RGB color for the hit text display when CritVisualizer is enabled
      bestaimpoint: Renders a box at the optimal aiming point on the target entity
      bestaimpointsize: Sets the size of the best aim point box (0.01 = tiny, 1 = large, requires BestAimPoint enabled)
      bestaimpointcolor: Sets the RGB color for the best aim point box when BestAimPoint is enabled
      duration: Sets how long the hit text remains visible in milliseconds (100 = brief, 4000 = long, requires CritVisualizer enabled)
  chinahat:
    description: Renders a hat on the player character's head
    settings:
      colormode: |
        Selects the color mode for the hat rendering:
        - Fade: Smooth gradient between Color1 and Color2
        - Rainbow: Dynamic rainbow color effect with configurable alpha
        - Astolfo: Special color gradient effect with configurable alpha
      color1: Sets the first gradient color when ColorMode is set to Fade
      color2: Sets the second gradient color when ColorMode is set to Fade
      rainbow alpha: Controls the transparency of the hat when using Rainbow color mode (0.1 = almost transparent, 255 = fully opaque)
      astolfo alpha: Controls the transparency of the hat when using Astolfo color mode (0.1 = almost transparent, 255 = fully opaque)
      hatqualitiy: Sets the rendering quality of the hat by controlling the number of triangles (8 = low quality/better performance, 300 = high quality/smooth appearance)
      radius: Controls the radius size of the hat (0.1 = very small, 10 = very large)
      height: Sets the vertical height of the conical hat shape (0.1 = flat, 1 = tall cone)
      y offset: Adjusts the vertical position offset of the hat relative to the player's head (-0.1 = lower, 1 = higher)
      rotationspeed: Controls the rotation speed of the color gradient animation in degrees per second (0 = static colors, 360 = one full rotation per second)
      rotationoffset: Sets the starting angle offset for the color gradient rotation (0-360 degrees)
      infirstperson: Renders the hat even when in first-person view (normally only visible in third-person)
      rotate with player: Makes the hat rotate with the player's head rotation and yaw direction
      rotate with spoof rotations: Uses module rotation angles instead of actual head rotation when available (requires Rotate with player enabled)
      rotate vertical: Enables vertical tilting of the hat based on the player's pitch angle (requires Rotate with player enabled)
      only while module rotation: Only applies vertical rotation when module rotations are active (requires Rotate vertical enabled)
      outlinegroupygroupy: Settings group for configuring the outline effect around the hat edge
      enabled: Enables rendering of an outline around the outer edge of the hat for enhanced visibility
      line-width: Sets the thickness of the outline in pixels (0.01 = very thin, 4 = very thick)
      alpha: Controls the transparency of the outline (0.1 = almost transparent, 255 = fully opaque)
      red offset: Adjusts the red color channel of the outline relative to the hat color (-255 = darker red, 255 = brighter red)
      green offset: Adjusts the green color channel of the outline relative to the hat color (-255 = darker green, 255 = brighter green)
      blue offset: Adjusts the blue color channel of the outline relative to the hat color (-255 = darker blue, 255 = brighter blue)
  2ditems:
    description: Renders dropped items as 2D icons on screen for better visibility
    settings:
      items: Select which item types should be displayed in 2D (Bronze, Iron, Gold, Diamond, Emerald, Other)
      remove3ditems: Removes the 3D rendering of items in the world when enabled
      showstacksize: Displays the stack size number on the 2D item icons
      onlyatoptifinezoom: Only render items in 2D when Optifine zoom key is pressed
  hotbar:
    description: Adds an informative hotbar
    settings:
      hotbarscale: Controls the size scaling of the hotbar display (1 = normal size, 4 = quadruple size)
      armor: Displays your equipped armor pieces above the hotbar
      armordurability: Shows durability information for each armor piece when Armor is enabled
      armorshadow: Applies shadow effect to armor display for better visibility
      customhotbar: Enables the custom hotbar overlay with additional features like CPS, BPS and item highlighting
      blur: Applies blur post-processing effect to the custom hotbar background for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the custom hotbar for enhanced visibility
      customshadowcolor: Enables custom shadow color for the hotbar instead of using the default black shadow
      customshadowcolorvalue: Sets the RGB color for the shadow when CustomShadowColor is enabled
      itemrectangle: Highlights the entire hotbar item area with a colored rectangle background
      silentslot: Shows both the real selected slot and the silently selected slot with different highlight colors
      debuginformation: Displays debug information panel on the right side showing CPS, BPS and ping metrics
      otherpingcalculation: Uses an alternative method to calculate ping values when DebugInformation is enabled
      inventoryitems: Displays your inventory items (rows 1-3) above the hotbar for quick item overview
  emojify:
    description: Renders emojis on players after combo them
    settings:
      modes: |
        Selects the emoji design displayed above players after comboing them:
        - default1, default2, default3: Various default emoji styles
        - angry: Angry face emoji
        - pogchamp: Pogchamp emoji
        - prettygood: Pretty good emoji
        - trashmeme: Trash meme emoji
      combohits: Sets the minimum number of consecutive hits required to trigger the emoji display (0-5)
      combotime: Sets the time window in seconds during which hits count as a combo (0-5)
  blocktraceesp:
    description: Renders the fastest way to the bed
    settings:
      block: |
        Selects the block type to trace and highlight:
        - Bed: Traces bed blocks (Block ID 26) - useful for BedWars gamemodes
        - Cake: Traces cake blocks (Block ID 92)
        - Custom: Allows you to specify a custom block ID
      customid: Sets the custom block ID to trace when Block mode is set to Custom (0-400, where each number represents a different Minecraft block)
      blockcolor: Sets the RGB color and transparency for the ESP overlay highlighting the traced blocks
      blocklinewidth: Sets the width of the lines around the traced blocks (0-15, automatically scales with distance for better visibility)
      blockdistance: Sets the maximum render distance for traced blocks in blocks (1-300, blocks beyond this distance won't be highlighted)
      blockblur: Applies blur post-processing effect to the block ESP overlay for a softer, glowing appearance
      blockshadow: Applies shadow/bloom post-processing effect to the block ESP overlay for enhanced visibility and glow
      blockcustomshadowcolor: Enables custom shadow color for the block ESP instead of using the default shadow color
      blockcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect when BlockCustomShadowColor is enabled
      pathcolor: Sets the RGB color and transparency for the pathfinding overlay that shows the optimal route to the nearest traced block
      pathblur: Applies blur post-processing effect to the pathfinding overlay for a softer appearance
      pathshadow: Applies shadow/bloom post-processing effect to the pathfinding overlay for enhanced visibility
      pathcustomshadowcolor: Enables custom shadow color for the pathfinding overlay instead of using the default shadow color
      pathcustomshadowcolorvalue: Sets the RGB color for the custom shadow effect on the pathfinding overlay when PathCustomShadowColor is enabled
      pathsearchrange: Sets the search radius around the player for finding the nearest traced block to calculate the path (1-10 blocks)
  goldspawntimer:
    description: Displays a countdown for the next gold spawn on GommeHD bedwars
    settings:
      x-coord: Sets the horizontal position of the gold spawn timer on screen (0 = left edge, 100 = right edge)
      y-coord: Sets the vertical position of the gold spawn timer on screen (0 = top edge, 100 = bottom edge)
      scale: Controls the size scaling of the timer display (0.5 = half size, 4 = quadruple size)
      background: Enables a background rectangle behind the timer for better visibility
      backgroundcolor: Sets the RGB color and transparency of the background rectangle when BackGround is enabled
      blur: Applies blur post-processing effect to the timer background for a softer appearance
      shadow: Applies shadow/bloom post-processing effect to the timer for enhanced visibility
      customshadowcolor: Enables custom shadow color instead of using the default black shadow color
      customshadowcolorvalue: Sets the RGB color for the shadow when CustomShadowColor is enabled
  nobob:
    description: Other View Bobbing animations
    settings:
      mode: |
        Selects the bobbing removal method:
