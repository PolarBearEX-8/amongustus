  customguibackgroundcolor:
    description: Customizes the background color of GUI screens
    settings:
      guis: |
        Select which GUI screens should have custom background colors applied:
        - ClickGui: Apply to the client's ClickGui interface
        - Inventory: Apply to inventory and creative mode screens
        - EscapeMenu: Apply to the pause/escape menu
        - OtherMenus: Apply to all other GUI screens not covered above
      clickguigroupygroupy: Settings group for configuring ClickGui background customization
      clickguicolor: Sets the RGB color and transparency for the ClickGui background
      clickguiblur: Applies blur post-processing effect to the ClickGui background
      inventorygroupygroupy: Settings group for configuring inventory background customization
      inventorycolor: Sets the RGB color and transparency for the inventory background
      inventoryblur: Applies blur post-processing effect to the inventory background
      escapemenugroupygroupy: Settings group for configuring escape menu background customization
      escapemenucolor: Sets the RGB color and transparency for the escape menu background
      escapemenublur: Applies blur post-processing effect to the escape menu background
      othermenusgroupygroupy: Settings group for configuring other menus background customization
      othermenuscolor: Sets the RGB color and transparency for other menus backgrounds
      othermenusblur: Applies blur post-processing effect to other menus backgrounds
  customhurtcam:
    description: Customizes the camera shake effect when taking damage
    settings:
      removehurtcamatdeath: Disables the hurt camera shake effect when your health reaches zero or you die
      strength: Controls the intensity of the camera shake when taking damage (-35 = inverted strong shake, 0 = no shake, 35 = very strong shake)
  debuginformation:
    description: Displays debug information for development and testing
    settings:
      debug information: |
        Select which debug information should be displayed on screen:
        - FPS: Frames per second
        - Ping: Network latency to server
        - CPS: Clicks per second
        - PosX: X coordinate position
        - PosY: Y coordinate position
        - PosZ: Z coordinate position
        - BPS: Blocks per second movement speed
        - RX: Packets received per second
        - TX: Packets transmitted per second
        - Download: Download bandwidth usage
        - Upload: Upload bandwidth usage
        - Date: Current date
        - Time: Current time
      scale: Controls the size scaling of the debug information display (0.5 = half size, 4 = quadruple size)
      posx: Sets the horizontal position of the debug information on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the debug information on screen (0 = top edge, 100 = bottom edge)
      fontshadow: Enables shadow rendering behind the text for better readability
      leftcolor: Sets the RGB color for the labels displayed before values (e.g. "FPS:", "Ping:")
      rightcolor: Sets the RGB color for the actual values displayed after labels (e.g. the numbers)
  healthdisplay:
    description: Shows health information of the player on screen
    settings:
      scale: Controls the size scaling of the health display (0.5 = half size, 4 = quadruple size)
      posx: Sets the horizontal position of the health display on screen (0 = left edge, 100 = right edge)
      posy: Sets the vertical position of the health display on screen (0 = top edge, 100 = bottom edge)
      decimalplaces: Sets the number of decimal places shown for the health value (0 = whole numbers only, 3 = three decimals)
      spacing: Controls the horizontal spacing between the health number and the heart icon (0-10)
      fontshadow: Enables text shadow for both the health value and heart icon for better readability
      textcolor: Sets the RGB color for the health value text
      heartcolor: Sets the RGB color for the heart icon (❤)
  modelrenderer:
    description: Renders your player model into your gui overlay
    settings:
      renderarmor: Enables rendering of armor pieces on the displayed player model
      targets: |
        Select which players should have their model replaced:
        - Me: Replace your own player model
        - Players: Replace other players' models
  motionblur:
    description: Adds motion blur effect to the game for smoother visuals (nvidia only)
    settings:
      frame multiplier: Controls the blur intensity by affecting how much previous frames are retained
      additional frame precision: Adds fine-tuned precision to the frame multiplier calculation
      brightness: Adjusts the brightness level of the motion blur effect (50 = normal)
      only when focused: Only applies motion blur when the game window isa ctive
  particles:
    description: Spawns particles under you while walking
    settings: {}
  pfadfinder:
    description: Advanced pathfinding module to walk to enemies
    settings:
      auto targetgroupygroupy: Group header for automatic target settings
      auto target: Automatically selects and walks to valid targets
      targets: |
        Select which entity types should be considered as valid targets:
        - Player: Target other players
        - Mob: Target hostile mobs
        - Animal: Target passive animals
        - Villager: Target villagers
        - Invisible: Target invisible entities
        - Sleeping: Target sleeping players
      choose target by path length: Selects the target with the shortest path instead of shortest direct distance
      max considered targets: Maximum number of targets to evaluate simultaneously when choosing by path length (2-5)
      murder mystery: Special mode for Murder Mystery minigame that targets gold ingots or murderers
      max searchtime per tick: Maximum time in milliseconds spent on pathfinding calculations per tick (2-40)
      max steps: Maximum number of search iterations before giving up on finding a path (1-20)
      ticks between searches: Number of ticks to wait between pathfinding recalculations (0-20)
      max fall height: Maximum height in blocks the pathfinder is allowed to fall (1-255)
      discourage falldamage: Avoids paths that would cause fall damage by increasing their cost
      discourage falldamage factor: Factor for penalizing paths with fall damage (1 = maximum penalty, 100 = no penalty)
      pick target: Key binding to manually select a target entity or position by looking at it
      reset picked target: Key binding to clear the manually selected target and return to automatic targeting
      path color: Sets the RGB color for rendering the calculated path line
      target color: Sets the RGB color for highlighting the target entity or position
  notifications:
    description: Handles rendering of in-game notifications
    settings:
      blur: Applies blur post-processing effect to notification rendering for a softer appearance
      avoidduplications: Prevents duplicate notifications from appearing, instead showing a counter for repeated messages
      position: |
        Sets the screen position where notifications appear:
        - Top right: Notifications slide in from top-right corner
        - Top left: Notifications slide in from top-left corner
        - Bottom right: Notifications slide in from bottom-right corner
        - Bottom left: Notifications slide in from bottom-left corner
      duplicatetime: Sets the time window in seconds for grouping duplicate notifications (0-1)
      showduration: Sets how long notifications remain visible on screen in seconds (0-10)
      speed: Controls the animation speed of notification slide-in/out transitions (1 = slow, 10 = fast)
      groupcolormode: |
        Selects the color mode for notification group text:
        - Client color: Uses the client's theme color
        - Notification type: Uses color based on notification type (info, warning, error)
        - Fade: Color fades from red to green based on time remaining
        - Blank: Uses gray color
      progresscolormode: |
        Selects the color mode for notification progress bar:
        - Client color: Uses the client's theme color
        - Notification type: Uses color based on notification type (info, warning, error)
        - Fade: Color fades from red to green based on time remaining
        - Blank: Uses gray color
      notificationtypes: |
        Select which notification types should be displayed:
        - ModuleToggles: Show notifications when modules are toggled on/off
        - LevelSystem: Show level-up and achievement notifications
        - ConfigSystem: Show config load/save notifications
        - BeverageNotification: Show notifications for the BeverageNotify module
        - EnderPearlNotification: Show notifications for the EnderPearlNotify module
        - VanishNotification: Show notifications for the StaffDetector module
