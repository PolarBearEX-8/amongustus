<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 20" width="820" height="20" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="baseLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="25%" stop-color="#404040" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#d4d4d4" stop-opacity="0.95" />
      <stop offset="75%" stop-color="#404040" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="lineClip">
      <rect x="40" y="8" width="740" height="4" rx="2" />
    </clipPath>
  </defs>

  <rect x="40" y="9.25" width="740" height="1.5" rx="0.75" fill="url(#baseLine)" />
  <g clip-path="url(#lineClip)">
    <rect x="-120" y="8.5" width="140" height="3" rx="1.5" fill="url(#pulse)">
      <animate attributeName="x" values="-120;820" dur="3.4s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
